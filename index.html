<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetVirtua — Painel Interno</title>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2"
    window.supabase = createClient(
      "https://zbxrpprwjrholrycwsqa.supabase.co",
      "sb_publishable_c4O2UN_u487qWsu4TNwG0Q_OGj3aHNM"
    )
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    :root { --azul: #0284c7; --verde: #16a34a; --vermelho: #dc2626; --cinza: #64748b; --fundo: #f8fafc; }
    body { background: #e2e8f0; display: flex; height: 100vh; overflow: hidden; }

    /* 🔑 Tela de Acesso */
    .tela-chave { position: fixed; inset: 0; background: linear-gradient(135deg, #0284c7, #0ea5e9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
    .caixa-chave { background:white; padding:2.5rem; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,.15); width:100%; max-width:400px; text-align:center; }
    .caixa-chave h1 { color:var(--azul); margin-bottom:1.5rem; font-size:1.8rem; }
    .caixa-chave input { width:100%; padding:1rem; border:2px solid #e0f2fe; border-radius:12px; font-size:1rem; text-align:center; margin-bottom:1rem; }
    .caixa-chave button { width:100%; padding:1rem; background:var(--azul); color:white; border:none; border-radius:12px; font-weight:700; font-size:1rem; cursor:pointer; }
    .caixa-chave button:hover { background:#0369a1; }
    .erro-chave { color:var(--vermelho); margin-top:1rem; display:none; font-weight:500; }

    /* 📋 Barra Lateral — Lista de Clientes */
    .lateral { width: 320px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .cab-lateral { padding: 1.2rem; background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; }
    .cab-lateral h1 { font-size: 1.15rem; font-weight: 800; }
    .cab-lateral p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.3rem; }
    .lista-conversas { flex: 1; overflow-y: auto; }
    .item-conversa {
      padding: 1rem 1.2rem; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: .2s; position: relative;
    }
    .item-conversa:hover, .item-conversa.selecionado { background: #f0f9ff; }
    .item-conversa h3 { font-size: 0.95rem; color: #0f172a; display: flex; justify-content: space-between; }
    .item-conversa .ultima-msg { font-size: 0.85rem; color: var(--cinza); margin-top: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .item-conversa .hora { font-size: 0.75rem; color: #94a3b8; }
    .bolha-nova {
      position: absolute; right: 1.2rem; top: 1.4rem; width: 10px; height: 10px;
      background: var(--vermelho); border-radius: 50%; box-shadow: 0 0 0 3px #fee2e2;
    }

    /* 💬 Área da Conversa + Dados */
    .conteudo { flex: 1; display: flex; flex-direction: column; background: #f0f9ff; }
    .cab-conversa {
      padding: 1rem 1.5rem; background: white; border-bottom: 1px solid #e2e8f0;
      display: flex; gap: 1.5rem;
    }
    .info-principal { flex: 1; }
    .info-lado { width: 280px; border-left: 1px solid #e2e8f0; padding-left: 1.5rem; }
    .cab-conversa h2 { font-size: 1.05rem; color: #0f172a; }
    .dados-cliente-bloco { background: #f8fafc; border-radius: 10px; padding: 0.85rem; margin-bottom: 0.6rem; font-size: 0.88rem; }
    .dados-cliente-bloco strong { color: #0f172a; }
    .dados-cliente-bloco p { color: #475569; margin-top: 0.25rem; line-height: 1.4; }
    .sem-conversa {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 1.1rem;
    }

    .caixa-msg { flex: 1; padding: 1.5rem; overflow-y: auto; }
    .msg {
      max-width: 70%; padding: 0.85rem 1.1rem; border-radius: 18px; margin-bottom: 1rem;
      line-height: 1.5; font-size: 0.95rem; position: relative;
    }
    .msg.loja {
      background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .msg.cliente {
      background: white; color: #1e293b; border: 1px solid #e0f2fe;
      margin-right: auto; border-bottom-left-radius: 4px;
    }
    .msg .hora { font-size: 0.72rem; opacity: 0.7; margin-top: 0.3rem; text-align: right; }

    .barra-envio { padding: 1rem 1.5rem; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 0.8rem; }
    .barra-envio input { flex: 1; padding: 0.9rem 1.2rem; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 0.98rem; }
    .barra-envio input:focus { outline: none; border-color: var(--azul); }
    .btn-enviar {
      padding: 0.9rem 1.5rem; background: linear-gradient(135deg, #16a34a, #15803d); color: white;
      border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: .2s;
    }
    .btn-enviar:hover { transform: scale(1.03); }

    .sem-mensagem { text-align: center; padding: 3rem; color: #94a3b8; }
    .bloco-pets, .bloco-agendamentos { margin-top: 0.5rem; }
    .tag-pet { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.8rem; margin: 0.15rem; }
    .tag-agendamento { display: block; background: #f0fdf4; color: #15803d; padding: 0.3rem 0.5rem; border-radius: 6px; font-size: 0.8rem; margin: 0.3rem 0; }
  </style>
</head>
<body>

<!-- 🔑 Tela de Acesso Restrito -->
<div class="tela-chave" id="telaChave">
  <div class="caixa-chave">
    <h1>🔐 Acesso Restrito</h1>
    <input type="password" id="chaveAcesso" placeholder="Digite a chave de acesso" />
    <button onclick="verificarChave()">Entrar no Sistema</button>
    <div class="erro-chave" id="erroChave">❌ Chave incorreta!</div>
  </div>
</div>

<!-- 📋 Painel Completo -->
<div class="lateral" id="painel" style="opacity:0; pointer-events:none; transition:.3s;">
  <div class="cab-lateral">
    <h1>💬 Mensagens</h1>
    <p id="qtdClientes">Carregando...</p>
  </div>
  <div class="lista-conversas" id="listaConversas">
    <div class="sem-mensagem">Nenhuma conversa ainda.</div>
  </div>
</div>

<!-- 💬 Área da Conversa + Dados do Cliente -->
<div class="conteudo" id="conteudo" style="opacity:0; pointer-events:none; transition:.3s;">
  <div class="cab-conversa">
    <div class="info-principal">
      <h2 id="nomeClienteConv">Selecione um cliente</h2>
      <div class="dados-cliente" id="dadosResumidos"></div>
    </div>
    <div class="info-lado" id="blocoDados" style="display:none;">
      <div class="dados-cliente-bloco">
        <strong>👤 Dados Pessoais</strong>
        <p id="dadosPessoais"></p>
      </div>
      <div class="dados-cliente-bloco">
        <strong>🐾 Pets</strong>
        <p id="dadosPets"></p>
      </div>
      <div class="dados-cliente-bloco">
        <strong>📅 Agendamentos</strong>
        <p id="dadosAgendamentos"></p>
      </div>
    </div>
  </div>

  <div class="sem-conversa" id="semConversa">
    Selecione uma conversa ao lado<br>para ver mensagens e dados do cliente
  </div>
  <div class="caixa-msg" id="caixaMensagens" style="display:none;"></div>
  <div class="barra-envio" id="barraEnvio" style="display:none;">
    <input type="text" id="textoResposta" placeholder="Digite sua resposta..." />
    <button class="btn-enviar" onclick="enviarResposta()">➤ Enviar</button>
  </div>
</div>

<script>
const CHAVE_ACESSO = "7846SIS2026SPBRAS8510"; // 🔑 Chave de acesso
let clienteSelecionado = null;
let todasMensagens = [];
let todosClientes = [];
let todosAgendamentos = [];

// 🔑 Verificar Chave de Acesso
async function verificarChave() {
  const chave = document.getElementById("chaveAcesso").value.trim();
  if (chave === CHAVE_ACESSO) {
    document.getElementById("telaChave").style.display = "none";
    document.getElementById("painel").style.opacity = "1";
    document.getElementById("painel").style.pointerEvents = "auto";
    document.getElementById("conteudo").style.opacity = "1";
    document.getElementById("conteudo").style.pointerEvents = "auto";
    
    // Carregar tudo
    await carregarBaseDados();
    carregarListaConversas();
    setInterval(carregarListaConversas, 8000);
  } else {
    document.getElementById("erroChave").style.display = "block";
    setTimeout(() => document.getElementById("erroChave").style.display = "none", 3000);
  }
}

// 📚 Carregar base completa de clientes e agendamentos
async function carregarBaseDados() {
  const { data: c } = await supabase.from("clientes").select("*");
  const { data: a } = await supabase.from("agenda").select("*");
  todosClientes = c || [];
  todosAgendamentos = a || [];
}

// 📋 Carregar Lista de Conversas
async function carregarListaConversas() {
  const { data } = await supabase.from("mensagens").select("*").order("id", {asc:false});
  todasMensagens = data || [];

  // Agrupar por cliente
  const mapa = {};
  todasMensagens.forEach(m => {
    if (!mapa[m.cliente_id]) {
      mapa[m.cliente_id] = {
        id: m.cliente_id,
        nome: m.cliente_nome,
        ultima: m.texto,
        hora: m.data,
        mensagens: [],
        temNova: m.remetente === "cliente"
      };
    }
    mapa[m.cliente_id].mensagens.unshift(m);
  });

  const lista = Object.values(mapa);
  document.getElementById("qtdClientes").textContent = `${lista.length} conversa(s)`;

  const el = document.getElementById("listaConversas");
  if (lista.length === 0) {
    el.innerHTML = `<div class="sem-mensagem">Nenhuma mensagem recebida ainda.</div>`;
    return;
  }

  el.innerHTML = lista.map(c => `
    <div class="item-conversa ${clienteSelecionado?.id === c.id ? 'selecionado' : ''}" 
         onclick="abrirConversa(${c.id}, '${c.nome.replace(/'/g, "\\'")}')">
      ${c.temNova ? '<div class="bolha-nova"></div>' : ''}
      <h3>${c.nome} <span class="hora">${c.hora.split(" • ")[0]}</span></h3>
      <p class="ultima-msg">${c.ultima}</p>
    </div>
  `).join("");

  if (clienteSelecionado) {
    const atual = lista.find(c => c.id === clienteSelecionado.id);
    if (atual) renderizarMensagens(atual);
  }
}

// 💬 Abrir Conversa + Carregar Dados Completos
async function abrirConversa(id, nome) {
  clienteSelecionado = { id, nome };
  document.getElementById("semConversa").style.display = "none";
  document.getElementById("caixaMensagens").style.display = "block";
  document.getElementById("barraEnvio").style.display = "flex";
  document.getElementById("blocoDados").style.display = "block";
  document.getElementById("nomeClienteConv").textContent = nome;

  // Buscar dados completos do cliente
  const cliente = todosClientes.find(c => c.id === id);
  if (cliente) {
    // Dados resumidos no cabeçalho
    document.getElementById("dadosResumidos").innerHTML = `📞 ${cliente.telefone || '—'} | ✉️ ${cliente.email || '—'}`;
    
    // Bloco completo
    document.getElementById("dadosPessoais").innerHTML = `
      <strong>Telefone:</strong> ${cliente.telefone || 'Não informado'}<br>
      <strong>E-mail:</strong> ${cliente.email || 'Não informado'}<br>
      <strong>Endereço:</strong> ${cliente.endereco || 'Não informado'}
    `;

    // Pets
    let petsHtml = '';
    if (cliente.pets) {
      const pets = cliente.pets.split(" || ").filter(p => p.trim());
      pets.forEach(p => {
        const [nome, raca, dados, obs] = p.split(" | ");
        petsHtml += `<span class="tag-pet">🐾 ${nome || 'Pet'}${raca ? ` · ${raca}` : ''}</span>`;
        if (dados || obs) petsHtml += `<small style="display:block; font-size:0.75rem; color:#64748b; margin-left:0.4rem;">${dados || ''}${obs && obs!=='Obs: ' ? ` · ${obs.replace('Obs: ','')}` : ''}</small>`;
      });
    } else petsHtml = 'Nenhum pet cadastrado';
    document.getElementById("dadosPets").innerHTML = petsHtml;

    // Agendamentos
    let agendHtml = '';
    const agends = todosAgendamentos.filter(a => a.cliente === cliente.nome);
    if (agends.length > 0) {
      agends.slice(0,5).forEach(a => {
        agendHtml += `<span class="tag-agendamento">📅 ${a.servico} · ${a.pet}<br>${new Date(a.data).toLocaleString("pt-BR")}<br><strong>${a.status}</strong></span>`;
      });
      if (agends.length > 5) agendHtml += `<small>...e mais ${agends.length -5}</small>`;
    } else agendHtml = 'Nenhum agendamento';
    document.getElementById("dadosAgendamentos").innerHTML = agendHtml;
  } else {
    document.getElementById("dadosResumidos").innerHTML = 'Dados não encontrados';
    document.getElementById("dadosPessoais").innerHTML = '—';
    document.getElementById("dadosPets").innerHTML = '—';
    document.getElementById("dadosAgendamentos").innerHTML = '—';
  }

  // Carregar mensagens
  const mensagens = todasMensagens.filter(m => m.cliente_id === id);
  renderizarMensagens({ mensagens, nome });
}

function renderizarMensagens(c) {
  const el = document.getElementById("caixaMensagens");
  el.innerHTML = c.mensagens.map(m => `
    <div class="msg ${m.remetente === 'cliente' ? 'cliente' : 'loja'}">
      ${m.texto.replace(/\n/g, "<br>")}
      <div class="hora">${m.remetente === 'cliente' ? c.nome : 'Você'} • ${m.data}</div>
    </div>
  `).join("");
  el.scrollTop = el.scrollHeight;
}

// ✍️ Enviar Resposta
async function enviarResposta() {
  if (!clienteSelecionado) return alert("Selecione um cliente!");
  const texto = document.getElementById("textoResposta").value.trim();
  if (!texto) return;

  await supabase.from("mensagens").insert([{
    cliente_id: clienteSelecionado.id,
    cliente_nome: clienteSelecionado.nome,
    remetente: "loja",
    texto: texto,
    data: new Date().toLocaleString("pt-BR")
  }]);

  document.getElementById("textoResposta").value = "";
  carregarListaConversas();
  alert("✅ Resposta enviada!");
}

// Enter para enviar
document.getElementById("textoResposta").addEventListener("keypress", e => {
  if (e.key === "Enter") enviarResposta();
});
document.getElementById("chaveAcesso").addEventListener("keypress", e => {
  if (e.key === "Enter") verificarChave();
});
</script>
</body>
</html>
